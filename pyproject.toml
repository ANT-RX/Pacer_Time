[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacer-time"
version = "0.1.0"
description = "Registro, cronometraje y resultados de carreras. Todo local: Python + PySide6 + SQLite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
llrp = ["sllurp>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
pacer-time = "pacer_time.ui.app:main"
pacer-capture = "pacer_time.capture.cli:main"
pacer-sim = "pacer_time.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
